<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Mohamed Kamal</title>
<style>
:root{--bg:#0d0f11;--card:#111315;--bd:#34373c;--red:#e52a2a;--red2:#d51d1d;--tx:#f2f2f2;--mu:#9aa0a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:950px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}h1 span,h2 span,h3 span.r{color:var(--red)}
.muted{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:9px;background:#0d0f11;color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit}
textarea{min-height:160px;line-height:1.8}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button:hover{background:var(--red2)}button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pl{padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}.pl:hover{border-color:var(--red)}
.stat{background:#0d0f11;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;font-size:13px}
.stat b{display:block;font-size:19px;color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:right}
tr.sel td{background:#2a1010}tr.clk{cursor:pointer}
.err{color:var(--red);font-size:13px;margin:8px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--red);border-color:var(--red)}
.pane{display:none}.pane.on{display:block}
.meal{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.ph,.npr{display:none}
.tplbox{white-space:pre-wrap;line-height:2;font-size:15px}
@media print{
 body{background:#fff;color:#000}.card,.stat,.meal{background:#fff;border-color:#999;color:#000}.no-print{display:none!important}
 .pane{display:block!important}.ph{display:block;border-bottom:3px solid #c00;padding-bottom:10px;margin-bottom:16px}.ph h1{margin:0}
 .npr{display:block;white-space:pre-wrap;line-height:1.9}.stat b,h1 span,h2 span,h3 span.r{color:#c00}td,th{border-color:#ccc}tr.sel td{background:#eee}
 @page{margin:14mm}.card{break-inside:avoid}.muted{color:#555}}

/* ===== ثيم لوحة الكوتش (أسود + بنفسجي + ذهبي) ===== */
:root{--bg:#09090e;--card:#0f0f17;--bd:#3b3324;--tx:#f4f4f8;--mu:#8d8da0;--gold:#e8c766;--sub:#8b6cd6}
body{background:radial-gradient(1000px 420px at 50% -8%,#1c1042 0%,transparent 62%),#09090e}
.wrap{padding-bottom:170px}
.card{border-radius:22px;background:var(--card);border:1px solid var(--bd)}
.card h3{color:var(--gold)}h1 span,h2 span{color:var(--gold)}
button{background:linear-gradient(135deg,#6d28d9,#4c1d95);border-radius:14px}
button:hover{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
button.sec{background:#12121b;border:1px solid #2a2a3a;color:var(--tx)}button.sec:hover{background:#181824}
input,select,textarea{background:#0a0a11;border:1px solid #2a2a3a;border-radius:14px}
.tabs button{border-radius:14px;background:#12121b;border:1px solid #2a2a3a}.tabs button.on{background:linear-gradient(135deg,#5b21b6,#3b1a86);border-color:#7c3aed}
.stat{border-radius:16px;background:#0a0a11;border-color:#2a2a3a}.stat b{color:#fff}
.pl{border-radius:16px;background:#0c0c14;border-color:#2a2a3a}.pl:hover{border-color:#7c3aed}
.hero{background:linear-gradient(135deg,#6b21d6 0%,#2a0f63 48%,#0b0a16 100%);border:1px solid #2c2652;border-radius:26px;padding:22px 20px;margin-bottom:14px;position:relative}
.hero .ey{font-size:12px;letter-spacing:.18em;color:#cdbdf5;font-weight:700;direction:ltr;text-align:right}
.hero h1{font-size:30px;line-height:1.25;margin:8px 0 8px;color:#fff;direction:ltr;text-align:right}
.hero p{color:#cfc3ee;margin:0 0 16px;line-height:1.7}
.hero .hb{display:flex;gap:10px;flex-wrap:wrap}
.hero .wb{background:#fff;color:#111;font-weight:700;border-radius:16px;padding:14px 20px}
.hero .wb:hover{background:#eee}
.hero .db{background:#212630;border:1px solid #333a48;color:#fff;border-radius:16px;padding:14px 20px}
.hero .out{position:absolute;left:14px;top:14px;padding:6px 12px;font-size:12px;background:#ffffff18;border:1px solid #ffffff30}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{border:1px solid var(--bd);background:var(--card);border-radius:22px;padding:16px 16px 14px}
.kpi .l{color:#a8a8b8;font-size:13px}.kpi .n{font-size:34px;font-weight:800;color:#fff;margin:6px 0 4px;line-height:1.1}.kpi .e{color:var(--sub);font-weight:700;font-size:15px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa{display:flex;align-items:center;gap:12px;background:#0b0b12;border:1px solid #2a2a3a;border-radius:22px;padding:14px;color:var(--tx);text-align:right;width:100%}
.qa:hover{border-color:#7c3aed;background:#0e0e18}
.qa .ic{width:46px;height:46px;flex:none;border-radius:14px;background:#2a1258;display:flex;align-items:center;justify-content:center;font-size:20px;color:#c4a5ff}
.qa .t{flex:1}.qa b{display:block;font-size:17px;color:#fff;direction:ltr;text-align:right}.qa span{color:#9a9ab0;font-size:13px}
.hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd2 h3{margin:0}.hd2 span{color:#9a9ab0;font-size:13px}
.rc{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid #1d1d2a;cursor:pointer}
.rc .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#3b1a86);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;flex:none}
.rc .t{flex:1}.rc .t b{display:block;color:#fff}.rc .t span{color:#9a9ab0;font-size:13px}
.hs{color:var(--sub);font-size:.72em;font-weight:700;margin-inline-start:8px;letter-spacing:.04em;direction:ltr;display:inline-block}
.nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;background:#0c0c16ee;border:1px solid #2c2652;border-radius:26px;padding:10px;z-index:50;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:934px;margin:0 auto}
.nav button{flex:1 1 28%;background:#13131e;border:1px solid #2a2a3a;color:#e6e6ee;border-radius:16px;padding:13px 6px;font-size:14px}
.nav button.on{background:linear-gradient(135deg,#5b21b6,#3b1a86);border-color:#7c3aed;color:#fff}
.nav button.pdfb{background:linear-gradient(135deg,#a11212,#6f0b0b);border-color:#c22;color:#fff}
#bgl{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center top;background-repeat:no-repeat;display:none}
.card,.kpi,.qa{background:rgba(12,12,20,.80);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.login{background:rgba(8,8,12,.72)!important;border-color:#6a3517!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media print{.nav,#bgl{display:none!important}}
.acc{color:#f59e0b;font-weight:bold}.sep{color:#7a5a12}.hd{color:#fbbf24;font-weight:bold}.srl{color:#f59e0b}
.pgt{width:100%;border-collapse:collapse}.pgt td{padding:0;border:0}.sp{height:0}
.bk{direction:rtl}
.bkh{display:flex;justify-content:space-between;gap:10px;background:#000;border-bottom:2px solid #7a5a12;padding:9px 12px;color:#f59e0b;font-weight:bold;font-size:12px;margin-bottom:14px}
.bkh span:last-child{color:#f2f2f2}
.bk h2{color:#fff;margin:0 0 4px;font-size:22px}.bk .sub{color:#f59e0b;font-size:13px;margin-bottom:12px}
table.bt{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px}
table.bt th{background:#f59e0b;color:#000;padding:8px;text-align:right;font-size:12px}
table.bt td{padding:8px;border-bottom:1px solid #2a2a2e;vertical-align:top}
table.bt tr:nth-child(even) td{background:#111114}
.bt .sr{color:#f59e0b;font-weight:bold;white-space:nowrap;direction:ltr;text-align:center}
.bt .tot td{border-top:2px solid #f59e0b;font-weight:bold;color:#f59e0b}
.bt .ms{color:#9aa0a6;font-size:11.5px;margin-top:4px}
.bkbox{border:1px solid #7a5a12;border-radius:10px;padding:12px;margin-bottom:12px;background:#111114;white-space:pre-wrap;line-height:1.9;font-size:13.5px}
.bkbox b{color:#f59e0b}
.bkp{break-before:page;page-break-before:always}
.mealc{border:1px solid #2a2a2e;border-radius:10px;margin-bottom:10px;overflow:hidden;background:#101013;break-inside:avoid;page-break-inside:avoid}
.mh{display:flex;align-items:center;gap:10px;background:#1a1408;border-bottom:1px solid #7a5a12;padding:8px 12px}
.mn{width:30px;height:30px;border-radius:50%;border:2px solid #f59e0b;color:#f59e0b;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;flex:none}
.mt{flex:1}.mt b{color:#fff;font-size:14px}
.mm{display:flex;gap:6px;font-size:11.5px;color:#ddd;flex-wrap:wrap;justify-content:flex-end}
.mm span{background:#000;border:1px solid #34373c;border-radius:6px;padding:2px 7px;direction:ltr}.mm .kc{color:#f59e0b;border-color:#7a5a12;font-weight:bold}
.mt2{width:100%;border-collapse:collapse}.mt2 td{padding:7px 12px;border-bottom:1px solid #1e1e22;font-size:13.5px}.mt2 tr:last-child td{border-bottom:0}
.mt2.sp td{color:#cfcfd4;font-size:12.5px;background:#0d0d10}
.mt2 .q{text-align:left;color:#f59e0b;font-weight:bold;white-space:nowrap;width:1%;unicode-bidi:plaintext}
.bt .c{text-align:center;white-space:nowrap}.bt .n{color:#f59e0b;font-weight:bold;width:1%}
.bkc{text-align:center;padding-top:80mm}.bkc .big{font-size:30px;font-weight:bold;color:#fff}.bkc .big span{color:#f59e0b}
.cover{text-align:center;margin-bottom:14px}.cover img{max-width:320px;border-radius:12px;border:1px solid var(--bd)}
@media print{
 html,body.pdfmode{background:#0a0a0b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.pdfmode{color:#f2f2f2}
 body.pdfmode .wrap{max-width:none;padding:0;margin:0}
 body.pdfmode .cover{margin:0;width:210mm;height:297mm;break-after:page;page-break-after:always;overflow:hidden}
 body.pdfmode .cover img{width:210mm;height:297mm;max-width:none;object-fit:cover;border:0;border-radius:0;display:block}
 body.pdfmode .sp{height:14mm}
 body.pdfmode .pg{padding:0 14mm!important}
 body.pdfmode .ph{display:block;background:#000;border-bottom:3px solid #f59e0b;padding:8mm 6mm;margin-bottom:8mm;color:#f59e0b}
 body.pdfmode .ph h1,body.pdfmode .ph span{color:#f59e0b}
 body.pdfmode .tplbox{background:#0a0a0b;color:#f2f2f2;border:0;padding:0;margin:0;font-size:13.5px;line-height:1.95;break-inside:auto;page-break-inside:auto}
 body.pdfmode .pg{break-inside:auto}
}

const $=s=>document.querySelector(s), app=$("#app");
const DB="coach_kamal_v1";
let store={pw:null,players:[],db:{foods:[],ex:[],sup:[]}};
// ===== التخزين: IndexedDB (ملف لكل لاعب) مع بديل احتياطي =====
const DBN="coach_kamal_db";let DBH=null;const FB={players:{},meta:{}};
const PR=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const os=(n,m)=>DBH.transaction(n,m||"readonly").objectStore(n);
const fbSave=()=>{try{localStorage.setItem(DBN+"_fb",JSON.stringify(FB))}catch(_){alert("مساحة التخزين ممتلئة")}};
function idbOpen(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{r.result.createObjectStore("players",{keyPath:"id"});r.result.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(_){res(null)}})}
const getMeta=async k=>DBH?PR(os("meta").get(k)):FB.meta[k];
const putMeta=async(k,v)=>{if(DBH)await PR(os("meta","readwrite").put(v,k));else{FB.meta[k]=v;fbSave()}};
const getPlayer=async id=>DBH?PR(os("players").get(id)):FB.players[id];
const putPlayerRaw=async p=>{if(DBH)await PR(os("players","readwrite").put(p));else{FB.players[p.id]=p;fbSave()}};
const delPlayerRaw=async id=>{if(DBH)await PR(os("players","readwrite").delete(id));else{delete FB.players[id];fbSave()}};
const allPlayers=async()=>DBH?PR(os("players").getAll()):Object.values(FB.players);
const saveMeta=()=>{putMeta("asst",store.asst||[]);putMeta("pw",store.pw||null);putMeta("db",store.db);putMeta("cover",store.cover||null)};
let smMsg="";
const toIdx=p=>({id:p.id,name:p.name,updated:p.updated||0,w:p.d.weight,age:p.d.age,mode:p.d.mode,goal:p.d.goal,phase:p.d.phase,ts:p.d.tsplit,sys:p.d.system});
function updateIdx(p){const ix=toIdx(p),i=store.players.findIndex(x=>x.id===p.id);if(i>=0)store.players[i]=ix;else store.players.unshift(ix)}
const pend={},tmr={};
function persistPlayer(p){updateIdx(p);pend[p.id]=p;clearTimeout(tmr[p.id]);tmr[p.id]=setTimeout(()=>{delete pend[p.id];putPlayerRaw(p).catch(e=>alert("تعذر الحفظ: "+e))},250)}
function touch(p){p.updated=Date.now();persistPlayer(p)}
addEventListener("pagehide",()=>Object.values(pend).forEach(p=>putPlayerRaw(p)));
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")Object.values(pend).forEach(p=>putPlayerRaw(p))});
const fmt=t=>t?new Date(t).toLocaleDateString("ar-EG"):"—";
const navHTML=active=>{const T=[["home","🏠 الرئيسية"],["players","👥 اللاعبين"],["player","👤 اللاعب"],["updates","📏 التحديثات"],["plans","📋 الخطط"]];
  return `<nav class="nav no-print">${T.map(([k,l])=>`<button data-nav="${k}" class="${k===active?"on":""}">${l}</button>`).join("")}<button data-nav="pdf" class="pdfb">🖨️ PDF / طباعة</button></nav>`};
async function navTo(k){
  if(k==="home")return homeView();if(k==="players")return listView();
  const p=store.cur?await getPlayer(store.cur):null;
  if(!p){alert("اختار لاعب من قائمة اللاعبين الأول");return listView()}
  if(k==="player"){tab=0;return playerView(p)}if(k==="updates"){tab=5;return playerView(p)}if(k==="plans"){tab=1;return playerView(p)}
  if(k==="pdf")return previewView(p,PV.kind||"book");
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b){e.stopPropagation();navTo(b.dataset.nav)}},true);
async function boot(){
  DBH=await idbOpen();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  if(!DBH){try{Object.assign(FB,JSON.parse(localStorage.getItem(DBN+"_fb")||"{}"))}catch(_){}FB.players=FB.players||{};FB.meta=FB.meta||{}}
  store.pw=(await getMeta("pw"))||null;store.db=(await getMeta("db"))||store.db;store.cover=(await getMeta("cover"))||undefined;store.cur=(await getMeta("cur"))||null;store.lk=(await getMeta("lk"))||{n:0,until:0};store.asst=(await getMeta("asst"))||[];
  try{ // ترحيل بيانات النسخة القديمة (localStorage)
    const old=localStorage.getItem(DB);
    if(old&&!(await getMeta("migrated_v1"))){
      const o=JSON.parse(old);
      if(o.pw&&!store.pw){store.pw=o.pw;await putMeta("pw",o.pw)}
      if(o.db&&(o.db.foods||[]).length+(o.db.ex||[]).length+(o.db.sup||[]).length&&!(await getMeta("db"))){store.db=o.db;await putMeta("db",o.db)}
      if(o.cover&&!store.cover){store.cover=o.cover;await putMeta("cover",o.cover)}
      for(const pl of (o.players||[])){if(!(await getPlayer(pl.id)))await putPlayerRaw({...pl,created:pl.created||Date.now(),updated:pl.updated||Date.now()})}
      await putMeta("migrated_v1",1);
    }
  }catch(e){console.warn(e)}
  store.players=(await allPlayers()).filter(p=>p&&p.d).map(toIdx).sort((a,b)=>b.updated-a.updated);
  loginView();
}
function snapshot(p,kind){const d=p.d;p.snaps=p.snaps||[];
  p.snaps.unshift({t:Date.now(),kind,phase:d.phase,split:(SPLITS[d.tsplit]||[""])[0],weight:d.weight,mode:d.mode,data:clone({plans:d.plans,days:d.days,sups:d.sups,system:d.system,week:d.week,cyc:d.cyc,tw:d.tw,tint:d.tint,tsplit:d.tsplit,supMode:d.supMode,phase:d.phase,weight:d.weight,height:d.height,age:d.age,mode:d.mode,goal:d.goal})});
  p.snaps=p.snaps.slice(0,5);touch(p)}
const hashL=s=>{let h=5381;for(const c of s+"kimo-salt")h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h)};
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const h2b=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const b64e=u=>{let t="";for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const HAS_CR=!!(window.crypto&&crypto.subtle);
async function pbk(pw,salt,bits){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits","deriveKey"]);
  if(bits)return b2h(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256));
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function mkPw(pw){if(!HAS_CR)return hashL(pw);const s=crypto.getRandomValues(new Uint8Array(16));return "p2$"+b2h(s)+"$"+await pbk(pw,s,1)}
async function chkPw(pw,st){if(st&&st.startsWith("p2$")){if(!HAS_CR)return false;const a=st.split("$");return (await pbk(pw,h2b(a[1]),1))===a[2]}return hashL(pw)===st}
async function encJson(o,pw){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await pbk(pw,s,0);

const PP_NUM=t=>String(t).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/٫/g,".").replace(/،/g,",");

const PP_MEALH=PP_W("(?:وجبة|الوجبة|meal)\\s*\\d+|الإفطار|الفطار|الغدا|الغداء|العشا|العشاء|السحور|سناك|snack|breakfast|lunch|dinner|pre[- ]?workout|post[- ]?workout|intra[- ]?workout|قبل التمرين|بعد التمرين|أثناء التمرين|اثناء التمرين|قبل النوم|بعد النوم|before (?:bed|sleep)");
const PP_NOTEH=PP_W("ملاحظات|ملاحظة|notes?");
function ppHeadKind(l){if(PP_SUPH.test(l))return"sups";if(PP_DAYH.test(l))return"day";if(PP_MEALH.test(l))return"meal";if(PP_NOTEH.test(l))return"notes";return null}
const ppTok=s=>ppNorm(s).toLowerCase().replace(/[()\[\]{}.,:;/+|—–&]/g," ").replace(/-/g," ").split(" ").filter(w=>w.length>=2);
// مطابقة اسم بقاعدة بيانات: تطابق تام (عربي أو إنجليزي) ثم تطابق كلمات. لو أكتر من نتيجة متساوية → null
function ppMatch(name,list,key){const q=ppNorm(name).toLowerCase().replace(/\(.*?\)/g,"").trim();if(!q)return null;
  const parts=x=>key(x).split(" — ").map(s=>ppNorm(s).toLowerCase().replace(/\(.*?\)/g,"").trim());
  const exact=list.filter(x=>parts(x).includes(q));if(exact.length===1)return exact[0];if(exact.length>1)return {amb:true};
  const qt=ppTok(q);if(!qt.length)return null;let best=[],bs=0;
  list.forEach(x=>{const et=ppTok(key(x)),common=qt.filter(w=>et.includes(w)).length,sc=common/qt.length;
    if(common<Math.min(2,qt.length)||sc<0.6)return;if(sc>bs){bs=sc;best=[x]}else if(sc===bs)best.push(x)});
  return best.length===1?best[0]:(best.length>1?{amb:true}:null)}
const PP_ALIAS=[["chicken breast","صدور دجاج"],["chicken","دجاج"],["rice","أرز أبيض"],["oats","شوفان"],["oatmeal","شوفان"],["egg whites","بياض بيض"],["egg","بيض كامل"],["eggs","بيض كامل"],["بيضة","بيض كامل"],["بيضات","بيض كامل"],["olive oil","زيت زيتون"],["salmon","سلمون"],["tuna","تونة"],["broccoli","بروكلي"],["spinach","سبانخ"],["sweet potato","بطاطا حلوة"],["potato","بطاطس"],["pasta","مكرونة"],["banana","موز"],["peanut butter","زبدة فول سوداني"],["almonds","لوز"],["cucumber","خيار"],["tomato","طماطم"],["carrot","جزر"],["beef","لحم بقري"],["turkey","ديك رومي"],["avocado","أفوكادو"],["chia","بذور شيا"],["tahini","طحينة"]];
const ppFindFood=(n,foods)=>{const r=ppMatch(n,foods,f=>f.n);if(r)return r;const q=ppNorm(n).toLowerCase();const al=PP_ALIAS.find(([en])=>q.includes(en));if(!al)return null;const c=foods.filter(f=>ppNorm(f.n).includes(al[1]));return c.length===1?c[0]:(c.length>1?{amb:true}:null)};
const ppFindEx=(n,exs)=>ppMatch(n,exs,e=>e.n);

const PP_UNIT_G={"ملعقة":15,"ملاعق":15,"tbsp":15,"ملعقة كبيرة":15,"ملعقة صغيرة":5,"tsp":5};
// تحليل سطر طعام: "200 جم أرز" / "2 بيضة" / "أرز أبيض 150 جرام" / "Chicken 150g"
function ppFood(line,foods){const s=ppNorm(line);
  const UNIT="جم|جرام|جرامات|g|gr|grams?|كجم|كيلو|kg|مل|ml|بيضة|بيضات|حبة|حبات|شريحة|شرائح|قطعة|قطع|عدد|ملعقة كبيرة|ملعقة صغيرة|ملعقة|ملاعق|tbsp|tsp|eggs?|slices?|pcs?|pieces?|كوب|cup";
  let qty=null,unit="",name=s,qtxt="",m=s.match(new RegExp("^(\\d+(?:[.,]\\d+)?)\\s*(?:("+UNIT+")(?=\\s|$))?\\s*(?:من\\s+|of\\s+)?(.+)$","i"));
  if(m){qty=parseFloat(m[1].replace(",","."));unit=(m[2]||"").toLowerCase();qtxt=m[1]+(unit?" "+unit:"");name=m[3].trim()}
  else{m=s.match(new RegExp("^(.+?)\\s*[-–:،,]?\\s*(\\d+(?:[.,]\\d+)?)\\s*(?:("+UNIT+")(?=\\s|$))?\\s*$","i"));if(m){name=m[1].trim();qty=parseFloat(m[2].replace(",","."));unit=(m[3]||"").toLowerCase();qtxt=m[2]+(unit?" "+unit:"")}}
  name=name.replace(/[-–:،,]+$/,"").trim();
  const f=ppFindFood(name,foods);
  if(!f)return {ok:false,why:"مش لاقي الصنف ده في قاعدة الأطعمة — اختاره من القايمة تحت",name,qtxt};if(f.amb)return {ok:false,why:"أكتر من صنف بيشبه الاسم — اكتب الاسم كامل",name};
  let g;
  if(qty===null)g=f.pc||100;
  else if(/^(جم|جرام|جرامات|g|gr|grams?|مل|ml)$/.test(unit))g=qty;
  else if(/^(كجم|كيلو|kg)$/.test(unit))g=qty*1000;
  else if(PP_UNIT_G[unit]&&!f.pc)g=qty*PP_UNIT_G[unit];
  else if(f.pc)g=qty*f.pc;
  else return {ok:false,why:"الكمية محتاجة جرامات (مثلاً 150 جم)",name,qtxt};
  return {ok:true,it:{n:f.n,g:Math.round(g*10)/10}}}

const PP_SETS=/(\d{1,2})\s*(?:sets?|سيت|سيتات|جولات|جولة)?\s*[×xX*]\s*(\d{1,2}(?:\s*[-–—]\s*\d{1,2})?(?:\s*(?:ثانية|ث|sec|s|دقيقة|دقايق|د|min|m))?(?:\s*(?:لكل رجل|لكل ذراع|each side))?)/i;
const PP_REST=/(?:راحة|rest)\s*[:\-]?\s*(\d{1,3}(?:\s*[-–]\s*\d{1,3})?\s*(?:ثانية|ثانيه|ث|sec|s|دقيقة|دقايق|دقيقتين|د|min|m)?)/i;
const PP_RIR=/(?:RIR|ريبس)\s*[:\-]?\s*(\d(?:\s*[-–]\s*\d)?)/i;
const PP_DAYIDX={"السبت":0,"الأحد":1,"الاحد":1,"الاثنين":2,"الإثنين":2,"الثلاثاء":3,"الأربعاء":4,"الاربعاء":4,"الخميس":5,"الجمعة":6,"saturday":0,"sunday":1,"monday":2,"tuesday":3,"wednesday":4,"thursday":5,"friday":6};
const PP_DUR=/^(.*?)\s*(\d+(?:\s*[-–]\s*\d+)?\s*(?:دقيقة|دقايق|دقائق|min|mins|minutes?|ثانية|sec|secs))(?=\s|$)\s*(.*)$/i;
const PP_CARD=/^(cardio|كارديو)\s*[:：]\s*(.+)$/i;
const PP_BLOCKKW=/^(cardio|كارديو|abs|البطن|بطن|warm[- ]?up|إحماء|mobility|حركية|core)(?=\s|$|[:：|(])/i;
function ppDayTitle(s){const m=s.match(PP_W("(?:يوم|اليوم|day)\\s*\\d+|"+PP_DAYW));let t=m?s.slice(m[0].length):s;return t.replace(/^[\s:：|\-–—,(]+|[\s)]+$/g,"").trim()}
function ppDayWd(s,n){const w=s.toLowerCase().match(new RegExp("("+PP_DAYW+")","i"));return w?PP_DAYIDX[w[1].toLowerCase()]??PP_DAYIDX[w[1]]??(n%7):(n%7)}
function ppExLine(s,exs){
  const m=s.match(PP_SETS);let name=s,sr="",after="";
  if(m){name=s.slice(0,m.index);sr=(m[1]+" × "+m[2]).replace(/\s*[-–—]\s*/g,"–").replace(/\s+/g," ").trim();after=s.slice(m.index+m[0].length)}
  else{const dm=s.match(PP_DUR);if(dm){name=dm[1];sr=dm[2];after=dm[3]}}
  const rs=(after.match(PP_REST)||[])[1]||"",rr=(after.match(PP_RIR)||[])[1]||"";
  const nt=after.replace(PP_REST,"").replace(PP_RIR,"").replace(/^[\s\-–—|:،,(]+|[\s)]+$/g,"").trim();
  name=name.replace(/^[\s\-–—:|]+|[\s\-–—:|(،,]+$/g,"").trim();
  return {name,sr,rs,rr,nt,ex:name?ppFindEx(name,exs):null,hasSets:!!m}}
const ppIsBlockHead=s=>s.length<=45&&(/[:：]\s*$/.test(s)||/^[A-Z0-9][A-Z0-9 &+\/|\-–()]*$/.test(s)||/\|/.test(s)&&s.length<=45);
const PP_WHEN=/(قبل|بعد|مع|أثناء|صباح|صبح|مساء|الصبح|النوم|الإفطار|الفطار|الغدا|العشا|التمرين|pre|post|morning|night|before|after|with)/i;
function ppSupLine(s,ctx){
  const segs=s.split(/\s[-–—]\s|\s?\(|\)/).map(x=>x.trim()).filter(Boolean);
  const name=segs[0]||s;let dose="",when="";

  const sp=ppFindSup(name,ctx.sups);
  if(sp&&!sp.amb)return {n:sp.n,dose:dose||sp.d||"",when:when||sp.w||"",ok:1};
  return {n:name,dose,when,unk:1,why:sp&&sp.amb?"أكتر من مكمل بيشبه الاسم — اكتب الاسم كامل":"مكمل مش موجود في قاعدة المكملات"}}

function parseProgram(text,ctx){
  const R={meals:[],sups:[],days:[],tw:[],tint:[],notes:[],unclear:[]};
  let sec="none",day=null,block=null,meal=null;
  const addUnclear=(l,why)=>R.unclear.push({l,why});
  const newDay=(title)=>{const n=R.days.length;day={wd:ppDayWd(title,n),t:ppDayTitle(title)||("يوم "+(n+1)),blocks:[{h:null,items:[]}]};R.days.push(day);block=day.blocks[0];return day};
  const newMeal=(title)=>{meal={t:title,w:"",items:[]};R.meals.push(meal);return meal};
  const dayLine=(s)=>{
    if(!day)newDay("تمرين");
    const c=s.match(PP_CARD);if(c){block=day.blocks.find(b=>b.h==="الكارديو | CARDIO")||(()=>{const b={h:"الكارديو | CARDIO",items:[]};day.blocks.push(b);return b})();dayLine(c[2]);return}
    if(PP_BLOCKKW.test(s)&&!/\d\s*[×xX*]\s*\d/.test(s)&&!ppFindEx(s,ctx.exs)&&s.length<=45){block={h:s.replace(/[:：]\s*$/,""),items:[]};day.blocks.push(block);return}
    if(ppIsBlockHead(s)&&!/\d/.test(s)&&!ppFindEx(s,ctx.exs)){block={h:s.replace(/[:：]\s*$/,""),items:[]};day.blocks.push(block);return}
    const e=ppExLine(s,ctx.exs);
    if(!block){block={h:null,items:[]};day.blocks.push(block)}
    if(!e.name){addUnclear(s,"سطر من غير اسم تمرين");return}
    if(e.ex&&e.ex.amb){const why="أكتر من تمرين بيشبه الاسم — اكتب الاسم كامل";block.items.push({n:e.name,sr:e.sr,rs:e.rs,rr:e.rr,nt:e.nt,unk:1,why});addUnclear(s,why);return}
    if(e.ex){block.items.push({n:e.ex.n,sr:e.sr,rs:e.rs,rr:e.rr,nt:e.nt});return}
    if(e.hasSets){block.items.push({n:e.name,sr:e.sr,rs:e.rs,rr:e.rr,nt:e.nt,custom:1});addUnclear(s,"التمرين ده مش في قاعدة التمارين — هيتكتب بالاسم اللي كتبته");return}
    const why="مش واضح: مفيش عدد سيتات ولا تمرين معروف";block.items.push({n:e.name,sr:"",nt:e.nt,unk:1,why});addUnclear(s,why);
  };
  const mealLine=(s)=>{
    if(!meal)newMeal("الوجبة "+(R.meals.length+1));
    const tl=s.match(/^(.+?)\s[-–—]\s(.+)$/);let base=s,tail="";if(tl&&PP_WHEN.test(tl[2])&&!/\d+\s*(جم|جرام|g)\b/i.test(tl[2])){base=tl[1];tail=tl[2]}
    const parts=base.split(/\s*[،+]\s*|,\s+/).filter(Boolean);
    if(parts.length>1){parts.forEach(pt=>{const o=ppFood(pt,ctx.foods);if(o.ok){meal.items.push(o.it);return}const sp=ppFindSup(o.name||pt,ctx.sups);if(sp&&!sp.amb){R.sups.push({n:sp.n,dose:o.qtxt||sp.d||"",when:tail||meal.t});return}const why=o.why||"مش واضح";meal.items.push({n:o.name||pt,g:0,txt:pt,unk:1,why});addUnclear(pt,why)});return}
    const oks=[ppFood(base,ctx.foods)];
    if(/^(قبل|بعد|أثناء|اثناء|وقت|توقيت)(?=\s|$)/.test(s)&&!/\d+\s*(جم|جرام|g)/i.test(s)){meal.w=meal.w?meal.w+" · "+s:s;return}
    const f=oks[0];
    if(f.ok){meal.items.push(f.it);return}
    const sp=ppFindSup(f.name||base,ctx.sups);
    if(sp&&!sp.amb){R.sups.push({n:sp.n,dose:f.qtxt||sp.d||"",when:tail||meal.t});return}
    const why=f.why||"مش واضح";meal.items.push({n:f.name||base,g:0,txt:s,unk:1,why});addUnclear(s,why);
  };

}

  $("#bkc").onclick=async()=>{const players=await allPlayers();const ok=await copyText(JSON.stringify({v:2,db:store.db,players}));$("#bke").style.color=ok?"#25d366":"";$("#bke").textContent=ok?`✓ تم نسخ ${players.length} لاعب كنص — الصقه في ملاحظات أو رسالة لنفسك للاحتفاظ به`:"تعذّر النسخ"};

function dbView(kind){
  reset();setBg("app");
  const T={foods:["الأطعمة",allFoods,store.db.foods],ex:["التمارين",allEx,store.db.ex],sup:["المكملات",allSup,store.db.sup]};
  const list=T[kind][1]();
  const head={foods:"<th>الصنف</th><th>التصنيف</th><th>بروتين</th><th>كارب</th><th>دهون</th>",ex:"<th>التمرين</th><th>العضلة</th>",sup:"<th>المكمل</th><th>التصنيف</th><th>الجرعة</th><th>التوقيت</th>"}[kind];
  const cells=x=>kind==="foods"?`<td>${esc(x.n)}</td><td>${FCAT[x.c]}</td><td>${x.p}</td><td>${x.cb}</td><td>${x.f}</td>`:kind==="ex"?`<td>${esc(x.n)}</td><td>${x.g}</td>`:`<td>${esc(x.n)}</td><td>${esc(x.c)}</td><td>${esc(x.d)}</td><td>${esc(x.w)}</td>`;
  const form={
   foods:`<input id="f1" placeholder="اسم الصنف"><select id="f2">${Object.entries(FCAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><input id="f3" type="number" placeholder="بروتين/100جم"><input id="f4" type="number" placeholder="كارب/100جم"><input id="f5" type="number" placeholder="دهون/100جم"><input id="f6" type="number" placeholder="وزن الوحدة بالجرام (اختياري، بيضة=50)">`,
   ex:`<input id="f1" placeholder="اسم التمرين"><select id="f2">${EGRP.map(g=>`<option>${g}</option>`).join("")}</select>`,
   sup:`<input id="f1" placeholder="اسم المكمل"><input id="f2" placeholder="التصنيف"><input id="f3" placeholder="الجرعة"><input id="f4" placeholder="التوقيت">`}[kind];
  app.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="sec" id="back">← رجوع</button><h2>قواعد <span>البيانات</span></h2></div>
  <div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===kind?"on":""}" data-k="${k}">${v[0]}</button>`).join("")}</div>
  <div class="card"><h3>إضافة جديد</h3><div class="grid">${form}</div><button id="addn" style="margin-top:10px">إضافة</button></div>
  <div class="card"><input id="q" placeholder="بحث..." style="margin-bottom:10px"><div style="overflow-x:auto"><table><tr>${head}<th></th></tr><tbody id="tb"></tbody></table></div></div>`;
  const draw=()=>{const q=$("#q").value.trim();$("#tb").innerHTML=list.filter(x=>x.n.includes(q)).map(x=>`<tr>${cells(x)}<td>${x.custom?`<button class="sec" data-del="${esc(x.n)}">✕</button>`:""}</td></tr>`).join("");
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const a=T[kind][2],i=a.findIndex(y=>y.n===b.dataset.del);if(i>=0){a.splice(i,1);saveMeta();dbView(kind);}});};
  $("#q").oninput=draw;draw();
  $("#back").onclick=listView;document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>dbView(b.dataset.k));
  $("#addn").onclick=()=>{const v=i=>$("#f"+i)?.value.trim();if(!v(1))return;
    if(kind==="foods")store.db.foods.push({n:v(1),c:v(2),p:+v(3)||0,cb:+v(4)||0,f:+v(5)||0,pc:+v(6)||undefined});
    else if(kind==="ex")store.db.ex.push({n:v(1),g:v(2)});
    else store.db.sup.push({n:v(1),c:v(2)||"أخرى",d:v(3),w:v(4)});
    saveMeta();dbView(kind);};
}

       <div class="muted" style="margin-top:4px">الوجبة: ${Math.round(s.p*4+s.c*4+s.f*9)} kcal · ب${Math.round(s.p)} ك${Math.round(s.c)} د${Math.round(s.f)}</div></div>`}).join("")||'<div class="muted">لا توجد وجبات — أضف وجبة أو حمّل القالب</div>'}</div>`;

  <div class="card no-print">${r.warn?'<div class="err">فيه خطة فاضية — ارجع للتغذية وحمّل القالب أو أضف وجبات</div>':""}<b>المعاينة بشكل القالب</b> <span class="muted">— ده اللي هيتطبع بالظبط</span><div style="margin-top:8px">
   ${chk("o0",PV.cover,"صورة الغلاف")}${chk("o2",PV.notes,"الملاحظات"+(kind==="diet"?" والكارديو":""))}
   ${chk("o3",PV.info,"بيانات اللاعب في الأعلى")}${kind==="diet"||kind==="book"?chk("o6",p.d.supMode==="separate","المكملات منفصلة عن التغذية"):""}${kind==="book"?chk("ob1",PV.bn,"التغذية")+chk("ob2",PV.bt,"التمرين")+chk("ob3",PV.bs,"المكملات"):""}${kind==="diet"?chk("o1",PV.train,"برنامج التمرين المختار في الأسفل")+chk("o4",PV.actual,"الأرقام من الأصناف الفعلية"):""}</div>
   <div style="margin-top:10px"><label style="display:inline-block">تغيير صورة الغلاف<input type="file" id="cvf" accept="image/*"></label> ${store.cover?'<button class="sec" id="cvr">استرجاع الغلاف الافتراضي</button>':""}</div></div>
  ${PV.cover?`<div class="cover"><img src="${cover}" alt="cover"></div>`:""}
  <table class="pgt"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td class="pg"><div class="ph"><h1>Coach <span>Mohamed Kamal</span> — كوتش كيمو</h1><div>${esc(p.name)} · ${new Date().toLocaleDateString("ar-EG")}</div></div>
  ${r.html?`<div class="bk">${r.html}</div>`:`<div class="card tplbox" ${kind==="train"||kind==="sups"?'dir="ltr" style="text-align:left"':""}>${r.out.map(fmtLine).join("\n")}</div>`}</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table>`;
  $("#bk").onclick=()=>{tab=kind==="train"?2:kind==="book"?0:kind==="sups"?3:1;playerView(p)};
  $("#kd").onclick=()=>previewView(p,"diet");$("#kt").onclick=()=>previewView(p,"train");$("#kb").onclick=()=>previewView(p,"book");$("#ks").onclick=()=>previewView(p,"sups");
  $("#sv2").onclick=()=>{if(canShareFiles())$("#sv").click();else{snapshot(p,kind);showTextShare($("#pdfbox"),p,kind)}};
  $("#wt").onclick=()=>{snapshot(p,kind);showTextShare($("#pdfbox"),p,kind)};
  $("#sv").onclick=async()=>{const box=$("#pdfbox");box.style.display="block";box.textContent="جارٍ إنشاء الـ PDF...";snapshot(p,kind);
    const nm=(kind==="sups"?"المكملات-":kind==="book"?"كتيب-":kind==="train"?"برنامج-التمرين-":"برنامج-التغذية-")+p.name+".pdf";
    try{await new Promise(r=>setTimeout(r,40));const {blob,n,urls}=await makePdf(p,kind);showPdfResult(box,blob,n,nm,p,kind,urls);if(inViewer()){const pe=box.querySelector("#pe");if(pe)await saveViaViewer(blob,nm,pe)}}
    catch(e){box.innerHTML='<div class="err">تعذّر إنشاء الـ PDF داخل هذا المتصفح ('+esc(e.message||e)+'). جرّب زرار 🖨 طباعة، أو افتح الملف من Safari/Chrome.</div>'}};
  $("#pr").onclick=()=>{snapshot(p,kind);const t0=document.title;document.title=(kind==="sups"?"المكملات-":kind==="book"?"كتيب-":kind==="train"?"برنامج-التمرين-":"برنامج-التغذية-")+p.name;let done=false;addEventListener("afterprint",()=>{done=true},{once:true});window.print();document.title=t0;
    setTimeout(()=>{if(!done){const b=$("#pdfbox");b.style.display="block";b.innerHTML='<div class="muted">الطباعة مش مدعومة في المتصفح ده — بجهزلك صور الصفحات بدلها...</div>';$("#sv").click()}},1200);};
  const tg=(id,k)=>{const el=$("#"+id);if(el)el.onchange=e=>{PV[k]=e.target.checked;previewView(p,kind)}};
  tg("ob1","bn");tg("ob2","bt");tg("ob3","bs");$("#o6")&&($("#o6").onchange=e=>{p.d.supMode=e.target.checked?"separate":"inline";touch(p);previewView(p,kind)});tg("o0","cover");tg("o1","train");tg("o2","notes");tg("o3","info");tg("o4","actual");
  $("#cvf").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/im.height),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);try{store.cover=c.toDataURL("image/jpeg",.85);saveMeta();}catch(_){alert("الصورة كبيرة على التخزين")}previewView(p,kind)};im.src=fr.result};fr.readAsDataURL(f)};
  if($("#cvr"))$("#cvr").onclick=()=>{delete store.cover;saveMeta();previewView(p,kind)};
}
boot();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
